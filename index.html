
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>দেশ বিদেশ শপিং সেন্টার</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

header {
  background: #087b43;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

header h1 {
  margin: 0 0 10px;
}

header p {
  margin: 5px;
}

.currency {
  text-align: center;
  padding: 15px;
  background: white;
}

.currency select {
  padding: 10px;
  font-size: 16px;
}

h2 {
  text-align: center;
  margin-top: 25px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 15px;
  padding: 15px;
  max-width: 1100px;
  margin: auto;
}

.product {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  text-align: center;
  padding-bottom: 15px;
  box-shadow: 0 2px 8px #00000015;
}

.product img {
  width: 100%;
  height: 175px;
  object-fit: cover;
  background: #eee;
}

.product h3 {
  font-size: 17px;
  margin: 12px 5px 8px;
}

.price {
  color: #087b43;
  font-size: 18px;
  font-weight: bold;
  margin: 10px 0;
}

button {
  background: #087b43;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 15px;
}

button:hover {
  background: #055d32;
}

footer {
  text-align: center;
  padding: 25px 10px;
  background: #173c2b;
  color: white;
  margin-top: 25px;
}

footer a {
  color: #ffeb80;
}

.note {
  text-align: center;
  padding: 10px;
  color: #555;
}
</style>
</head>

<body>

<header>
  <h1>দেশ বিদেশ শপিং সেন্টার</h1>
  <p>Desh Bidesh Shopping Center</p>
  <p>বাংলাদেশ ও মালয়েশিয়ায় অনলাইন শপিং</p>
</header>

<div class="currency">
  <label for="currency"><strong>আপনার মুদ্রা বেছে নিন:</strong></label>
  <br><br>
  <select id="currency" onchange="showProducts()">
    <option value="BDT">বাংলাদেশি টাকা (৳)</option>
    <option value="MYR">মালয়েশিয়ান রিঙ্গিত (RM)</option>
  </select>
</div>

<h2>আমাদের পণ্যসমূহ</h2>

<p class="note">
  পণ্য পছন্দ করুন, দাম দেখুন এবং WhatsApp-এ অর্ডার করুন।
</p>

<div class="products" id="products"></div>

<footer>
  <h3>দেশ বিদেশ শপিং সেন্টার</h3>
  <p>পণ্য অর্ডার করতে নিচের বোতামে চাপ দিন।</p>
  <p>যোগাযোগ: WhatsApp</p>
  <p>© Desh Bidesh Shopping Center</p>
</footer>

<script>
/*
  এখানে আপনার নিজের WhatsApp নম্বর বসাবেন।
  দেশের কোডসহ নম্বর লিখবেন, কিন্তু + বা স্পেস দেবেন না।
  উদাহরণ: 60123456789
*/
const WHATSAPP_NUMBER = "60123456789";

/*
  এগুলো নমুনা দাম।
  BDT = বাংলাদেশি টাকা
  MYR = মালয়েশিয়ান রিঙ্গিত

  1 MYR = 30 BDT এখানে শুধু উদাহরণ হিসেবে ধরা হয়েছে।
  আসল বিনিময় হার অনুযায়ী পরিবর্তন করবেন।
*/

const products = [
  {
    name: "পুরুষদের টি-শার্ট",
    category: "জামা",
    bdt: 450,
    myr: 15,
    image: "https://placehold.co/400x400?text=T-Shirt"
  },
  {
    name: "পুরুষদের শার্ট",
    category: "জামা",
    bdt: 900,
    myr: 30,
    image: "https://placehold.co/400x400?text=Shirt"
  },
  {
    name: "মহিলাদের পোশাক",
    category: "জামা",
    bdt: 1200,
    myr: 40,
    image: "https://placehold.co/400x400?text=Women+Dress"
  },
  {
    name: "মহিলাদের থ্রি-পিস",
    category: "জামা",
    bdt: 1800,
    myr: 60,
    image: "https://placehold.co/400x400?text=Three+Piece"
  },
  {
    name: "জিন্স প্যান্ট",
    category: "জামা",
    bdt: 1050,
    myr: 35,
    image: "https://placehold.co/400x400?text=Jeans"
  },
  {
    name: "স্পোর্টস জুতা",
    category: "জুতা",
    bdt: 1500,
    myr: 50,
    image: "https://placehold.co/400x400?text=Shoes"
  },
  {
    name: "স্যান্ডেল",
    category: "জুতা",
    bdt: 600,
    myr: 20,
    image: "https://placehold.co/400x400?text=Sandals"
  },
  {
    name: "মহিলাদের ব্যাগ",
    category: "ব্যাগ",
    bdt: 900,
    myr: 30,
    image: "https://placehold.co/400x400?text=Handbag"
  },
  {
    name: "স্কুল ব্যাগ",
    category: "ব্যাগ",
    bdt: 750,
    myr: 25,
    image: "https://placehold.co/400x400?text=School+Bag"
  },
  {
    name: "বাচ্চাদের পোশাক",
    category: "জামা",
    bdt: 600,
    myr: 20,
    image: "https://placehold.co/400x400?text=Kids+Clothes"
  }
];

function showProducts() {
  const currency = document.getElementById("currency").value;
  const container = document.getElementById("products");

  container.innerHTML = "";

  products.forEach(function(product) {
    const price = currency === "BDT"
      ? "৳ " + product.bdt
      : "RM " + product.myr;

    const card = document.createElement("div");
    card.className = "product";

    const img = document.createElement("img");
    img.src = product.image;
    img.alt = product.name;
    img.loading = "lazy";

    const title = document.createElement("h3");
    title.textContent = product.name;

    const category = document.createElement("p");
    category.textContent = "ধরন: " + product.category;

    const priceElement = document.createElement("p");
    priceElement.className = "price";
    priceElement.textContent = price;

    const button = document.createElement("button");
    button.textContent = "WhatsApp-এ অর্ডার";

    button.onclick = function() {
      const message =
        "আমি এই পণ্যটি অর্ডার করতে চাই।\n" +
        "পণ্যের নাম: " + product.name + "\n" +
        "দাম: " + price + "\n" +
        "দেশ ও ডেলিভারির তথ্য জানতে চাই।";

      const url =
        "https://wa.me/" + WHATSAPP_NUMBER +
        "?text=" + encodeURIComponent(message);

      window.open(url, "_blank");
    };

    card.appendChild(img);
    card.appendChild(title);
    card.appendChild(category);
    card.appendChild(priceElement);
    card.appendChild(button);

    container.appendChild(card);
  });
}

showProducts();
</script>

</body>
</html>
